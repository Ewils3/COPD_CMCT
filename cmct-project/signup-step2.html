<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Step 2</title>
  <link rel="stylesheet" href="style.css" >
</head>
<body class="login-screen">
  <div class="login-card">
    <h1>Create Username &amp; Password</h1>
    <p class="subtitle">Step 2 of 2</p>
    <form id="signup-form">
      <input type="text" id="username" placeholder="Create Username" required >
      <input type="password" id="password" placeholder="Create Password" required >
      <input type="password" id="confirm-password" placeholder="Confirm Password" required >
      <button type="submit">Sign Up</button>
    </form>
    <p class="register-text">Already have an account? <a href="login.html">Login</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Step 1</title>
  <link rel="stylesheet" href="style.css" >
</head>
<body class="login-screen">
  <div class="login-card">
    <h1>Create Account</h1>
    <p class="subtitle">Step 1 of 2</p>
    <form action="signup-step2.html">
      <input type="text" placeholder="First Name" required >
      <input type="text" placeholder="Last Name" required >
      <input type="text" placeholder="Date of Birth (DD/MM/YYYY)" required >
      <input type="tel" placeholder="Mobile Number" required >
      <input type="email" placeholder="Email" required >
      <input type="text" name="accessCode" placeholder="Access Code" required>

        <p class="forgot-link">
          <a href="access-code-info.html">What’s this?</a>
        </p>

      <button type="submit">Next</button>
    </form>
  </div>
</body>
</html>
